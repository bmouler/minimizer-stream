[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "minimizer-stream"
version = "0.1.0"
description = "Streaming canonical minimizer sketches for FASTA and FASTQ"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Bert Mouler" }]
keywords = ["bioinformatics", "minimizer", "fasta", "fastq", "sketching"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "mypy>=1.14",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
minimizer-stream = "minimizer_stream.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minimizer_stream"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["minimizer_stream"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100

[tool.mypy]
strict = true
files = ["src"]
python_version = "3.11"
